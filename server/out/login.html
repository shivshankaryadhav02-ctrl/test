<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteLink - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Neon Gradients -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px] animate-pulse" style="animation-duration: 4s"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[120px] animate-pulse" style="animation-duration: 6s"></div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md relative z-10">
        <div class="bg-[#111] border border-white/10 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
                <p class="text-gray-400 text-sm">Sign in to your RemoteLink account</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden mb-4 bg-red-900/50 border border-red-500 text-red-200 text-xs p-3 rounded-lg text-center"></div>

            <form id="login-form" class="space-y-4">
                <!-- Plan Selection Toggle -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-gray-400">Account Type</label>
                    <div class="grid grid-cols-2 gap-2 bg-black/40 p-1 rounded-xl border border-white/5">
                        <button type="button" id="btn-free" onclick="selectPlan('free')" class="py-2 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md">Free Account</button>
                        <button type="button" id="btn-premium" onclick="selectPlan('premium')" class="py-2 text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-white">Premium Account</button>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="space-y-1">
                    <label class="text-xs font-medium text-gray-400">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all" />
                </div>

                <!-- Password Input -->
                <div class="space-y-1">
                    <label class="text-xs font-medium text-gray-400">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all" />
                </div>

                <!-- Passkey Input (Conditional) -->
                <div id="passkey-container" class="space-y-1 hidden">
                    <label class="text-xs font-medium text-gray-400">8-Digit Passkey</label>
                    <input type="text" id="passkey" placeholder="Enter 8-digit key" maxlength="8" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all" />
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg hover:shadow-blue-500/20 text-sm">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-400">
                Don't have an account? <a class="text-blue-400 hover:text-blue-300 font-medium transition-colors" href="/auth/register">Create one</a>
            </div>

            <!-- Footer Branding -->
            <div class="mt-6 border-t border-white/5 pt-4 text-center text-[10px] text-gray-500 font-mono tracking-wider uppercase">
                Developed by Shiv Shankar Ydv
            </div>
        </div>
    </div>

    <script>
        let selectedPlan = 'free';

        function selectPlan(plan) {
            selectedPlan = plan;
            const btnFree = document.getElementById('btn-free');
            const btnPremium = document.getElementById('btn-premium');
            const passkeyContainer = document.getElementById('passkey-container');
            const passkeyInput = document.getElementById('passkey');

            if (plan === 'free') {
                btnFree.className = "py-2 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md";
                btnPremium.className = "py-2 text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-white";
                passkeyContainer.classList.add('hidden');
                passkeyInput.removeAttribute('required');
            } else {
                btnFree.className = "py-2 text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-white";
                btnPremium.className = "py-2 text-xs font-bold rounded-lg transition-all bg-gradient-to-r from-yellow-500 to-amber-600 text-white shadow-md";
                passkeyContainer.classList.remove('hidden');
                passkeyInput.setAttribute('required', 'true');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passkey = document.getElementById('passkey').value;
            const errorBanner = document.getElementById('error-banner');

            errorBanner.classList.add('hidden');
            errorBanner.innerText = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, passkey, planSelection: selectedPlan })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Save token
                localStorage.setItem('token', data.token);
                localStorage.setItem('jarvis_token', data.token);
                document.cookie = "token=" + data.token + "; path=/";
                document.cookie = "jarvis_token=" + data.token + "; path=/";

                // Save selected plan type in session storage for mobile connection
                sessionStorage.setItem('plan_selection', selectedPlan);

                window.location.href = '/dashboard';
            } catch (err) {
                errorBanner.innerText = err.message;
                errorBanner.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
