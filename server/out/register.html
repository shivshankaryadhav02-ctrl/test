<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteLink - Sign Up</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Neon Gradients -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px] animate-pulse" style="animation-duration: 4s"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[120px] animate-pulse" style="animation-duration: 6s"></div>
    </div>

    <!-- Register Card -->
    <div class="w-full max-w-md relative z-10">
        <div class="bg-[#111] border border-white/10 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Create Account</h1>
                <p class="text-gray-400 text-sm">Join RemoteLink and control your PC</p>
            </div>

            <!-- Error/Success Banners -->
            <div id="error-banner" class="hidden mb-4 bg-red-900/50 border border-red-500 text-red-200 text-xs p-3 rounded-lg text-center"></div>
            <div id="success-banner" class="hidden mb-4 bg-green-900/50 border border-green-500 text-green-200 text-xs p-3 rounded-lg text-center"></div>

            <form id="register-form" class="space-y-4">
                <!-- Name Input -->
                <div class="space-y-1">
                    <label class="text-xs font-medium text-gray-400">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all" />
                </div>

                <!-- Email Input -->
                <div class="space-y-1">
                    <label class="text-xs font-medium text-gray-400">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all" />
                </div>

                <!-- Password Input -->
                <div class="space-y-1">
                    <label class="text-xs font-medium text-gray-400">Password (Min. 6 characters)</label>
                    <input type="password" id="password" required minlength="6" placeholder="Choose a strong password" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all" />
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg hover:shadow-blue-500/20 text-sm">
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-400">
                Already have an account? <a class="text-blue-400 hover:text-blue-300 font-medium transition-colors" href="/auth/login">Sign in</a>
            </div>

            <!-- Footer Branding -->
            <div class="mt-6 border-t border-white/5 pt-4 text-center text-[10px] text-gray-500 font-mono tracking-wider uppercase">
                Developed by Shiv Shankar Ydv
            </div>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const errorBanner = document.getElementById('error-banner');
            const successBanner = document.getElementById('success-banner');

            errorBanner.classList.add('hidden');
            successBanner.classList.add('hidden');
            errorBanner.innerText = '';
            successBanner.innerText = '';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                successBanner.innerText = data.message || 'Registration successful! Redirecting to login...';
                successBanner.classList.remove('hidden');

                // Redirect to login page after 2 seconds
                setTimeout(() => {
                    window.location.href = '/auth/login';
                }, 2000);

            } catch (err) {
                errorBanner.innerText = err.message;
                errorBanner.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
